[project]
name = "auto-research"
version = "1.2.0"
description = "Local Auto Research pipeline for literature discovery, lawful acquisition, parsing, Zotero archiving, and review matrices."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=50,<51",
  "requests>=2.31",
  "PyYAML>=6.0",
  "PyMuPDF>=1.23"
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
ocr = ["pytesseract>=0.3", "Pillow>=10"]
desktop-macos = [
  "deepseek-harness-sdk==0.1.1rc1",
  "deepseek-harness-runtime-bin==0.1.1rc1",
  "pydantic>=2.12,<3",
  "pyarrow==24.0.0"
]

[project.scripts]
auto-research = "auto_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

markers = ["corpus: private historical corpus evaluation; explicitly selected, not an engineering check"]
addopts = "-m 'not corpus'"
