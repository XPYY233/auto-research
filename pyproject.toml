[project]
name = "auto-research"
version = "1.0.0"
description = "Local Auto Research pipeline for literature discovery, lawful acquisition, parsing, Zotero archiving, and review matrices."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42,<49",
  "requests>=2.31",
  "PyYAML>=6.0",
  "PyMuPDF>=1.23"
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
ocr = ["pytesseract>=0.3", "Pillow>=10"]

[project.scripts]
auto-research = "auto_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
