name: Engineering checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Always check source and full-history privacy
        run: |
          python3 scripts/check_repository.py
          python3 scripts/audit_public_history.py
      - id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF...HEAD" | python3 -c 'import sys; names=sys.stdin.read().splitlines(); sys.exit(0 if any(not (x.endswith(".md") or x.startswith("docs/history/") and x.endswith(".txt")) for x in names) else 1)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
  engineering:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.3'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
      - name: Install hash-locked engineering dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Shared then Mac checks (offline, synthetic data)
        run: python scripts/check.py
      - name: Dependency vulnerability audit
        run: python -m pip_audit --strict --progress-spinner off -r requirements-dev.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: engineering-check-results
          path: .artifacts/checks/*.xml
          retention-days: 14

  required:
    if: always()
    needs: [scope, engineering]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require privacy and applicable engineering checks
        env:
          PRIVACY_RESULT: ${{ needs.scope.result }}
          ENGINEERING_RESULT: ${{ needs.engineering.result }}
        run: |
          test "$PRIVACY_RESULT" = success
          test "$ENGINEERING_RESULT" = success -o "$ENGINEERING_RESULT" = skipped
