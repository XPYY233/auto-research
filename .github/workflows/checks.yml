name: Engineering checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.3'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
      - name: Install hash-locked engineering dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Shared then Mac checks (offline, synthetic data)
        run: python scripts/check.py
      - name: Dependency vulnerability audit
        run: python -m pip_audit --strict --progress-spinner off -r requirements-dev.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: engineering-check-results
          path: .artifacts/checks/*.xml
          retention-days: 14
